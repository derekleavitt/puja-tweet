name: ChromaBot Scheduled Color Drop

on:
  schedule:
    # 12:00 and 00:00 UTC = 06:00 / 18:00 America/Denver during DST (MDT, UTC-6).
    # Caveat: in standard time (MST, UTC-7) these fire at 05:00 / 17:00 local; adjust in winter.
    # Scheduled runs only execute when repo variable CHROMABOT_ACTIONS_ENABLED == 'true', and post
    # live only when repo variable CHROMABOT_ACTIONS_LIVE == 'true' (otherwise dry run).
    - cron: '0 12,0 * * *'
  workflow_dispatch:
    inputs:
      slot:
        description: 'Drop slot type (morning / evening / auto)'
        required: true
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - evening
      dry_run:
        description: 'Simulate without posting live to X (Dry Run)'
        required: false
        default: true
        type: boolean
      target_tweet_id:
        description: 'Optional override for Target Tweet ID'
        required: false
        default: ''
        type: string

jobs:
  post-chromatic-drop:
    runs-on: ubuntu-latest
    name: Generate & Post Chromatic Weather Drop
    # Off by default: manual dispatch, or scheduled only when explicitly enabled.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CHROMABOT_ACTIONS_ENABLED == 'true' }}
    environment: prod
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Execute Chromatic Drop
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_TOKEN_SECRET: ${{ secrets.TWITTER_ACCESS_TOKEN_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          TARGET_TWEET_ID: ${{ inputs.target_tweet_id || secrets.TARGET_TWEET_ID }}
          # Live only for dispatch with dry_run unchecked, or scheduled with CHROMABOT_ACTIONS_LIVE=true.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || (vars.CHROMABOT_ACTIONS_LIVE == 'true' && 'false' || 'true') }}
        run: |
          SLOT_ARG="${{ inputs.slot || 'auto' }}"
          echo "Executing drop for slot: $SLOT_ARG"
          npx tsx scripts/post-drop.ts --slot "$SLOT_ARG"
