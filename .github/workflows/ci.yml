name: CI Build & Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build & Verify Application

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Unit and API Tests
        run: npm test

      - name: Build Production Assets
        run: npm run build
        env:
          # Must be inert in a production build; the next step proves it.
          VITE_AUTH_DISABLED: 'true'

      - name: Verify dev auth bypass is absent from the production bundle
        run: "! grep -r 'dev-auth-bypass' dist"

      - name: Build and smoke-test the production server bundle
        run: |
          npm run build:server
          NODE_ENV=production AUTH_DISABLED=true STORE=json PORT=3412 DATA_DIR="$RUNNER_TEMP/smoke-data" \
            node dist-server/index.js > "$RUNNER_TEMP/smoke.log" 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for _ in $(seq 1 20); do
            curl -fsS http://127.0.0.1:3412/api/health && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3412/api/health || { cat "$RUNNER_TEMP/smoke.log"; exit 1; }
          curl -fsS http://127.0.0.1:3412/ | grep -qi '<!doctype html' || { cat "$RUNNER_TEMP/smoke.log"; exit 1; }

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-End Browser Tests
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/

      - name: Test Drop Generator in Dry-Run
        run: npx tsx scripts/post-drop.ts --dry-run
